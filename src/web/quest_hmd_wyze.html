<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Quest MR Passthrough × Wyze Cam ROS2 Teleop</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #ui-panel {
    position: fixed; top: 14px; left: 14px; right: 14px;
    max-width: 620px; background: rgba(15, 23, 42, 0.92);
    border: 1px solid #334155; border-radius: 12px;
    padding: 16px 20px; z-index: 20; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  h1 { margin: 0 0 8px 0; font-size: 18px; color: #38bdf8; }
  .row { margin: 5px 0; font-size: 14px; display: flex; justify-content: space-between; }
  .badge-ok { color: #4ade80; font-weight: bold; }
  .badge-warn { color: #fb923c; font-weight: bold; }
  .btn-group { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    font-size: 15px; font-weight: bold; padding: 10px 16px;
    border-radius: 8px; border: none; cursor: pointer;
    background: #0284c7; color: #fff;
  }
  button.ar-btn { background: #10b981; font-size: 16px; }
  button.secondary { background: #475569; }
  button.target-btn { background: #6366f1; font-size: 14px; padding: 8px 14px; }
  button:active { transform: scale(0.98); }
  #preview-box { margin-top: 10px; text-align: center; }
  #preview-img {
    width: 100%; max-height: 230px; object-fit: contain;
    border-radius: 8px; border: 1px solid #475569; background: #000;
  }
</style>
</head>
<body>
<div id="ui-panel">
  <h1>Quest MR Passthrough × Wyze Cam ROS2 Teleop</h1>
  <div class="row"><span>通信状態:</span> <span id="conn-status" class="badge-ok">待機中</span></div>
  <div class="row"><span>XRセッション:</span> <span id="xr-status">未開始</span></div>
  <div class="row"><span>HMD 角度 (Yaw / Pitch):</span> <span id="angle-readout">0.0° / 0.0°</span></div>
  <div class="row"><span>動作モード:</span> <span id="mode-readout">HMD追従 (ACTIVE)</span></div>
  <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">
    ・<strong>右トリガー / Aボタン</strong>: 現在の頭の向きを正面(0°, 0°)にリセット<br/>
    ・<strong>右グリップボタン</strong>: 追従の一時停止 / 再開 (Clutch)<br/>
    ・<strong>Bボタン</strong>: AI自動探索・追尾 ON/OFF &amp; ターゲット切替（カップ → ペットボトル → スマホ → 牛乳パック）
  </div>
  <div class="btn-group">
    <button id="enter-ar-btn" class="ar-btn">🟢 MRパススルー開始 (背景透過)</button>
    <button id="enter-vr-btn">VRモード開始</button>
    <button id="recenter-btn" class="secondary">正面リセット</button>
  </div>
  <div class="btn-group">
    <button class="target-btn" onclick="selectTarget(0)">🎯 カップ</button>
    <button class="target-btn" onclick="selectTarget(1)">🎯 ペットボトル</button>
    <button class="target-btn" onclick="selectTarget(2)">🎯 スマホ</button>
    <button class="target-btn" onclick="selectTarget(3)">🎯 牛乳パック</button>
    <button class="target-btn" onclick="selectTarget(4)">🎯 本 (Book)</button>
    <button class="target-btn" onclick="selectTarget(5)">🎯 リモコン</button>
    <button class="secondary" onclick="selectTarget(-1)">HMD追従に戻す</button>
  </div>
  <div class="btn-group">
    <button class="secondary" style="background:#d97706;" onclick="sendAction({finetune_visual:true})">📸 目の前の物体をFT学習 ([f])</button>
    <button class="secondary" style="background:#dc2626;" onclick="sendAction({toggle_record_demo:true})">🔴 デモ記録 ON/OFF ([d])</button>
    <button class="secondary" style="background:#7c3aed;" onclick="sendAction({train_bc:true})">🧠 模倣学習 (Train BC) ([l])</button>
  </div>
  <div id="preview-box">
    <img id="preview-img" alt="Wyze Cam 16:9 Wide Live Stream" />
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const connStatusEl = document.getElementById("conn-status");
const xrStatusEl = document.getElementById("xr-status");
const angleReadoutEl = document.getElementById("angle-readout");
const modeReadoutEl = document.getElementById("mode-readout");
const previewImg = document.getElementById("preview-img");

const TARGET_NAMES = [
  "カップ (Cup)",
  "ペットボトル (Bottle)",
  "スマホ (Phone)",
  "牛乳パック (Milk Carton)",
  "本・ノート (Book)",
  "リモコン (Remote)"
];

// ====== Three.js Scene (alpha: true + premultipliedAlpha: true で Quest パススルー合成を有効化) ======
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: true });
renderer.xr.enabled = true;
renderer.setClearColor(0x000000, 0);
renderer.setClearAlpha(0.0);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null; // 必ず null に維持（パススルーカメラ映像を背景に表示するため）

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);
scene.add(camera);

// Wyze Cam 本来の 16:9 広角フル画角 (960x540) ワイドスクリーン
const videoCanvas = document.createElement("canvas");
videoCanvas.width = 960;
videoCanvas.height = 540;
const videoCtx = videoCanvas.getContext("2d");
videoCtx.fillStyle = "#111";
videoCtx.fillRect(0, 0, 960, 540);
videoCtx.fillStyle = "#38bdf8";
videoCtx.font = "bold 28px sans-serif";
videoCtx.fillText("Connecting to Wyze Cam Pan v3 (16:9 Wide)...", 180, 270);

const videoTexture = new THREE.CanvasTexture(videoCanvas);
videoTexture.minFilter = THREE.LinearFilter;
videoTexture.magFilter = THREE.LinearFilter;

// 16:9 大型ワイドスクリーン (2.24m x 1.26m) を視界正面 -1.65m に配置
// 少し上や周囲の現実空間（パススルー）も見やすいよう絶妙なサイズ・位置に配置
const screenGeom = new THREE.PlaneGeometry(2.10, 1.18);
const screenMat = new THREE.MeshBasicMaterial({ map: videoTexture });
const screenMesh = new THREE.Mesh(screenGeom, screenMat);
screenMesh.position.set(0, -0.05, -1.65);
camera.add(screenMesh);

const borderGeom = new THREE.EdgesGeometry(new THREE.PlaneGeometry(2.14, 1.22));
const borderMat = new THREE.LineBasicMaterial({ color: 0x4ade80, linewidth: 3 });
const borderMesh = new THREE.LineSegments(borderGeom, borderMat);
borderMesh.position.set(0, -0.05, -1.649);
camera.add(borderMesh);

// ====== 16:9 ライブJPEGフレーム取得ループ ======
let fetchingFrame = false;
const frameLoader = new Image();
frameLoader.crossOrigin = "anonymous";
frameLoader.onload = () => {
  videoCtx.drawImage(frameLoader, 0, 0, videoCanvas.width, videoCanvas.height);
  videoTexture.needsUpdate = true;
  previewImg.src = frameLoader.src;
  fetchingFrame = false;
};
frameLoader.onerror = () => {
  fetchingFrame = false;
};

setInterval(() => {
  if (fetchingFrame) return;
  fetchingFrame = true;
  frameLoader.src = "/frame.jpg?t=" + performance.now();
}, 80);

// ====== HMD 姿勢計算 & クラッチ / ターゲット切替 ======
let refYaw = null;
let refPitch = null;
let paused = false;
let aiMode = false;
let targetIdx = 0;
let prevTrigger = false;
let prevGrip = false;
let prevBButton = false;
let lastSendTime = 0;
let isPassthroughSession = true;

function quaternionToYawPitchRoll(q) {
  const fx = -2.0 * (q.x * q.z + q.w * q.y);
  const fy = -2.0 * (q.y * q.z - q.w * q.x);
  const fz = -(1.0 - 2.0 * (q.x * q.x + q.y * q.y));
  const yawDeg = Math.atan2(fx, -fz) * (180.0 / Math.PI);
  const pitchDeg = Math.asin(Math.max(-1.0, Math.min(1.0, fy))) * (180.0 / Math.PI);
  return { yawDeg, pitchDeg };
}

function wrapAngleDeg(deg) {
  let d = ((deg + 180.0) % 360.0);
  if (d < 0) d += 360.0;
  return d - 180.0;
}

async function sendPoseToMac(yaw, pitch, extra = {}) {
  try {
    const payload = Object.assign({
      yaw: yaw,
      pitch: pitch,
      paused: paused,
      ts: Date.now() / 1000.0
    }, extra);
    if (extra.set_target) {
      payload.ai_mode = aiMode;
      payload.target_idx = targetIdx;
    }
    const resp = await fetch("/hmd_pose", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (resp.ok) {
      const data = await resp.json();
      if (!extra.set_target && typeof data.ai_mode === "boolean") {
        aiMode = data.ai_mode;
        targetIdx = data.target_idx || 0;
        updateModeUI();
      }
      connStatusEl.textContent = "接続中 (ROS2 Active)";
      connStatusEl.className = "badge-ok";
    }
  } catch (e) {
    connStatusEl.textContent = "通信エラー";
    connStatusEl.className = "badge-warn";
  }
}

window.sendAction = function(extraObj) {
  sendPoseToMac(0, 0, extraObj);
};

window.selectTarget = function(idx) {
  if (idx < 0) {
    aiMode = false;
  } else {
    aiMode = true;
    targetIdx = idx;
  }
  updateModeUI();
  sendPoseToMac(0, 0, { set_target: true });
};

document.getElementById("recenter-btn").addEventListener("click", () => {
  refYaw = null;
  refPitch = null;
  sendPoseToMac(0, 0, { recenter: true });
});

function updateModeUI() {
  if (aiMode) {
    modeReadoutEl.textContent = `AI探索・追尾: ${TARGET_NAMES[targetIdx]}`;
    borderMat.color.setHex(0x38bdf8);
  } else if (paused) {
    modeReadoutEl.textContent = "一時停止中 (CLUTCH PAUSED)";
    borderMat.color.setHex(0xfacc15);
  } else {
    modeReadoutEl.textContent = "HMD追従 (ACTIVE)";
    borderMat.color.setHex(0x4ade80);
  }
}

// クリックイベント内で直接 requestSession("immersive-ar") を呼ぶ（非同期チェックを挟まないことで確実にAR起動）
document.getElementById("enter-ar-btn").addEventListener("click", async () => {
  if (!navigator.xr) {
    alert("WebXRが有効ではありません。");
    return;
  }
  try {
    isPassthroughSession = true;
    scene.background = null;
    renderer.setClearColor(0x000000, 0);
    renderer.setClearAlpha(0.0);
    const session = await navigator.xr.requestSession("immersive-ar", {
      optionalFeatures: ["local-floor", "bounded-floor"]
    });
    xrStatusEl.textContent = "MRパススルー稼働中 (immersive-ar)";
    renderer.xr.setReferenceSpaceType("local-floor");
    await renderer.xr.setSession(session);
  } catch (arErr) {
    console.warn("immersive-ar failed, falling back to immersive-vr:", arErr);
    alert("immersive-ar (パススルー) が拒否されたため VR モードで起動します: " + arErr.message);
    const session = await navigator.xr.requestSession("immersive-vr", {
      optionalFeatures: ["local-floor"]
    });
    xrStatusEl.textContent = "VRモード稼働中 (immersive-vr)";
    renderer.xr.setReferenceSpaceType("local-floor");
    await renderer.xr.setSession(session);
  }
});

document.getElementById("enter-vr-btn").addEventListener("click", async () => {
  if (!navigator.xr) return;
  isPassthroughSession = false;
  scene.background = new THREE.Color(0x090d16);
  const session = await navigator.xr.requestSession("immersive-vr", {
    optionalFeatures: ["local-floor"]
  });
  xrStatusEl.textContent = "VRモード稼働中 (immersive-vr)";
  renderer.xr.setReferenceSpaceType("local-floor");
  await renderer.xr.setSession(session);
});

function onXRFrame(timestamp, frame) {
  if (isPassthroughSession) {
    scene.background = null;
    renderer.setClearColor(0x000000, 0);
    renderer.setClearAlpha(0.0);
  }

  const refSpace = renderer.xr.getReferenceSpace();
  if (!refSpace) return;

  const viewerPose = frame.getViewerPose(refSpace);
  if (!viewerPose) return;

  let triggerPressed = false;
  let gripPressed = false;
  let bPressed = false;

  for (const source of frame.session.inputSources) {
    if (!source.gamepad) continue;
    const btns = source.gamepad.buttons;
    if ((btns[0] && btns[0].pressed) || (btns[4] && btns[4].pressed)) {
      triggerPressed = true;
    }
    if (btns[1] && btns[1].pressed) {
      gripPressed = true;
    }
    if (btns[5] && btns[5].pressed) {
      bPressed = true;
    }
  }

  const q = viewerPose.transform.orientation;
  const { yawDeg, pitchDeg } = quaternionToYawPitchRoll(q);

  if (refYaw === null || (triggerPressed && !prevTrigger)) {
    refYaw = yawDeg;
    refPitch = pitchDeg;
  }
  if (gripPressed && !prevGrip) {
    paused = !paused;
    updateModeUI();
  }
  let targetChanged = false;
  if (bPressed && !prevBButton) {
    if (!aiMode) {
      aiMode = true;
      targetIdx = 0;
    } else {
      targetIdx++;
      if (targetIdx >= TARGET_NAMES.length) {
        targetIdx = 0;
        aiMode = false;
      }
    }
    targetChanged = true;
    updateModeUI();
  }
  prevTrigger = triggerPressed;
  prevGrip = gripPressed;
  prevBButton = bPressed;

  const relYaw = wrapAngleDeg(yawDeg - refYaw);
  const relPitch = Math.max(-60.0, Math.min(60.0, pitchDeg - refPitch));

  angleReadoutEl.textContent = `${relYaw.toFixed(1)}° / ${relPitch.toFixed(1)}°`;

  if (timestamp - lastSendTime >= 90 || targetChanged) {
    lastSendTime = timestamp;
    sendPoseToMac(relYaw, relPitch, { set_target: targetChanged });
  }
}

renderer.setAnimationLoop((timestamp, frame) => {
  if (frame) onXRFrame(timestamp, frame);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
